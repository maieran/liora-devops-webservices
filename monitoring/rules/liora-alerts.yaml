apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: liora-alerts
  namespace: monitoring

  labels:
    release: monitoring

spec:
  groups:
    - name: liora.application.rules

      rules:

        # Liora application endpoint is unreachable.
        - alert: LioraEndpointDown

          expr: |
            probe_success{
              liora_namespace=~"liora-(dev|staging|prod)"
            } == 0

          for: 2m

          labels:
            severity: critical

          annotations:
            summary: "Liora endpoint is down"
            description: >
              {{ $labels.application }} in
              {{ $labels.liora_namespace }}
              has failed its HTTP probe for more than 2 minutes.


        # A Liora pod is restarting repeatedly.
        - alert: LioraPodRestarting

          expr: |
            sum by (namespace, pod) (
              increase(
                kube_pod_container_status_restarts_total{
                  namespace=~"liora-(dev|staging|prod)"
                }[15m]
              )
            ) > 2

          for: 5m

          labels:
            severity: warning

          annotations:
            summary: "Liora pod is restarting repeatedly"
            description: >
              Pod {{ $labels.pod }} in namespace
              {{ $labels.namespace }}
              restarted more than twice during the last 15 minutes.


        # Deployment cannot provide all expected replicas.
        - alert: LioraDeploymentUnavailable

          expr: |
            kube_deployment_status_replicas_unavailable{
              namespace=~"liora-(dev|staging|prod)"
            } > 0

          for: 5m

          labels:
            severity: critical

          annotations:
            summary: "Liora deployment has unavailable replicas"
            description: >
              Deployment {{ $labels.deployment }} in namespace
              {{ $labels.namespace }}
              has unavailable replicas for more than 5 minutes.


        # MySQL / application PVC is stuck or lost.
        - alert: LioraPVCNotBound

          expr: |
            kube_persistentvolumeclaim_status_phase{
              namespace=~"liora-(dev|staging|prod)",
              phase=~"Pending|Lost"
            } == 1

          for: 5m

          labels:
            severity: critical

          annotations:
            summary: "Liora PVC is not bound"
            description: >
              PVC {{ $labels.persistentvolumeclaim }}
              in namespace {{ $labels.namespace }}
              has remained in {{ $labels.phase }} state for more than 5 minutes.


    - name: liora.infrastructure.rules

      rules:

        # Cluster node memory usage is becoming critical.
        - alert: NodeHighMemory

          expr: |
            (
              1 -
              (
                node_memory_MemAvailable_bytes
                /
                node_memory_MemTotal_bytes
              )
            ) * 100 > 90

          for: 10m

          labels:
            severity: warning

          annotations:
            summary: "Node memory usage is above 90%"
            description: >
              Node exporter target {{ $labels.instance }}
              has used more than 90% of available memory
              for at least 10 minutes.
