apiVersion: apps/v1
kind: Deployment

metadata:
  name: prestashop-app
  namespace: liora-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prestashop-app

  template:
    metadata:
      labels:
        app: prestashop-app

    spec:

      initContainers:
        - name: wait-for-prestashop-db
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for PrestaShop database..."

              until nc -z prestashop-db-service-headless 3306; do
                echo "prestashop-db is not ready yet..."
                sleep 2
              done

              echo "prestashop-db is reachable."

      containers:
        - name: prestashop-app
          image: andrem43/prestashop-kubernetes:base

          ports:
            - name: http
              containerPort: 80

          env:
            - name: DB_SERVER
              value: prestashop-db-service-headless

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: liora-db-secrets
                  key: PRESTASHOP_DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: liora-db-secrets
                  key: PRESTASHOP_DB_USER

            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: liora-db-secrets
                  key: PRESTASHOP_DB_PASSWORD

            - name: PS_INSTALL_AUTO
              value: "1"

            - name: PS_DEV_MODE
              value: "1"

            - name: PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: prestashop-configmap
                  key: PUBLIC_HOST

            - name: NGINX_NODE_PORT
              valueFrom:
                configMapKeyRef:
                  name: prestashop-configmap
                  key: NGINX_NODE_PORT

            - name: PS_DOMAIN
              value: "$(PUBLIC_HOST):$(NGINX_NODE_PORT)"

          # Use TCP probes for container-level health checks.
          # Public HTTP routing and application behavior are validated
          # externally through Nginx by the runtime tests.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5