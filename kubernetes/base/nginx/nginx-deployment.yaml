apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: liora-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-deployment

  template:
    metadata:
      labels:
        app: nginx-deployment

    spec:
      initContainers:
        - name: wait-for-applications
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for WordPress..."

              until nc -z wordpress-app-service 80; do
                echo "wordpress-app-service is not ready yet..."
                sleep 2
              done

              echo "WordPress is reachable."

              echo "Waiting for PrestaShop..."

              until nc -z prestashop-app-service 80; do
                echo "prestashop-app-service is not ready yet..."
                sleep 2
              done

              echo "PrestaShop is reachable."

      containers:
        - name: nginx-deployment
          image: andrem43/nginx-kubernetes:base

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: nginx-configmap
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-configmap
          configMap:
            name: nginx-configmap