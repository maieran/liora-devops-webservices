apiVersion: v1
kind: Service

metadata:
  name: nginx-service

spec:
  type: {{ .Values.nginx.service.type }}

  selector:
    app: nginx-deployment

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.nginx.service.port }}
      targetPort: http
      nodePort: {{ .Values.nginx.service.nodePort }}
