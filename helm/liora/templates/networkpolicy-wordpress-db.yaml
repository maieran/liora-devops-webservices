{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-wordpress-to-wordpress-db

spec:
  podSelector:
    matchLabels:
      app: wordpress-db

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress-app

      ports:
        - protocol: TCP
          port: 3306
{{- end }}

