apiVersion: apps/v1
kind: Deployment

metadata:
  name: wordpress-app

spec:
  replicas: {{ .Values.wordpress.replicaCount }}

  selector:
    matchLabels:
      app: wordpress-app

  template:
    metadata:
      labels:
        app: wordpress-app

    spec:
      initContainers:
        - name: wait-for-wordpress-db
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for WordPress database..."

              until nc -z wordpress-db-service-headless 3306; do
                echo "wordpress-db is not ready yet..."
                sleep 2
              done

              echo "wordpress-db is reachable."

      containers:
        - name: wordpress-app

          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.wordpress.service.port }}

          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-db-service-headless:3306

            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WORDPRESS_DB_NAME

            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WORDPRESS_DB_USER

            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: WORDPRESS_DB_PASSWORD

            - name: WORDPRESS_DEBUG
              value: {{ (ternary "1" "0" .Values.wordpress.debug) | quote }}

            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $publicHost =
                    $_SERVER['HTTP_X_FORWARDED_HOST']
                    ?? $_SERVER['HTTP_HOST']
                    ?? 'localhost';

                $publicProto =
                    $_SERVER['HTTP_X_FORWARDED_PROTO']
                    ?? 'http';

                define(
                    'WP_HOME',
                    $publicProto . '://' . $publicHost . '/wordpress'
                );

                define(
                    'WP_SITEURL',
                    $publicProto . '://' . $publicHost . '/wordpress'
                );

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

