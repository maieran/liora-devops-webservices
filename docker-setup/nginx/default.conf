server {
    listen 80;
    server_name _;

    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /wordpress {
        return 301 /wordpress/;
    }

    location /wordpress/ {
        proxy_pass http://wordpress/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /wp-admin/ {
    return 301 /wordpress$request_uri;
    }

    location = /wp-login.php {
        return 301 /wordpress/wp-login.php$is_args$args;
    }

    location = /prestashop {
        return 301 /prestashop/;
    }

    location /prestashop/ {
        # Trailing slash removes /prestashop/ before forwarding
        proxy_pass http://prestashop/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PrestaShop generates root-relative URLs such as:
    # /themes/..., /modules/..., /img/..., /6-accessories
    location / {
        proxy_pass http://prestashop;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}