events {}
http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log; 

    upstream wordpress_webservice {
        server wordpress:80; #docker container names
    }

    upstream prestashop_webservice {
        server prestashop:80; #docker container names that are listenting on same port
    }


    server { 
        listen 80;

        location / {
            return 200 "NGINX reverse proxy is running\nRoutes: /wordpress/ and /prestashop/\n";
        }

        location /wordpress/ {
            proxy_pass http://wordpress_webservice/;
            proxy_set_header Host $http_host; # serves the target address of the services in the Host header, we have two addresses that can be server
            proxy_set_header X-Real-IP $remote_addr; # transfers real remote IP address of incoming client connection to the proxy
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #highlights the list of the IP addreses of all server that has forwarded the incoming client
            proxy_set_header X-NginX-Proxy true; #a header marker that proxy is used
            #proxy_set_header X-Forwarded-Proto $scheme; #when it is clarified how cert-box can be applied.

            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;
        }

        location /prestashop/ {
            proxy_pass http://prestashop_webservice/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            #proxy_set_header X-Forwarded-Proto $scheme; #when it is clarified how cert-box can be applied.

            proxy_cache_bypass $http_upgrade;
            proxy_redirect off;
        }
    }
}




 