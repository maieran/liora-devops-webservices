events {}
http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log; 

    #Maximum allowed request body size
    #Necessary when images are uploaded to WordPress or PrestaShop
    #If request body exceeds the limit then 413 HTTP error
    client_max_body_size 64m;

    # Disable exposing more informations on nginx server 
    server_tokens off; 

    upstream wordpress_webservice {
        #Docker compose service name and internal container port
        server wordpress:80;
        #It keeps up to 16 idle connections that are available for reuse
        keepalive 16;
    }

    upstream prestashop_webservice {
        server prestashop:80;
        
        keepalive 16;
    }


    server { 
        listen 80;

        # Test only whether NGINX itself is running
        # Does not test WordPress, PrestaShop or their databases
        location = /healthy {
            access_log off;
            default_type text/plain;
            return 200 "NGINX reverse proxy is up and running\n";
        }

        # Internal NGINX connection/request statistics.
        # Accessible only from inside the NGINX container.
        location = /nginx_status {
            access_log off;
            #It helps to retrieve basic status information from surrounding location
            stub_status;

            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # Redirect /wordpress to /wordpress/
        location = /wordpress {
            return 301 /wordpress/;
        }

        # WordPress is accessible under /wordpress/
        location /wordpress/ {
            #Forwarding the request from proxy to the WordPress instance
            # The trailing slash helps to remove the prefix before forwarding
            # For example: /wordpress/wp-admin will become /wp-admin/
            proxy_pass http://wordpress_webservice/;
            
            proxy_http_version 1.1;
            
            # It preserves the hostname and port received from the client and serves then the target address of the services in the Host header
            proxy_set_header Host $http_host; 
            
            #It forwards the real client IP address to the proxy
            proxy_set_header X-Real-IP $remote_addr;
            
            # Maintains the chain of proxies through which the request passed.
            # Basically it highlights the list of the IP addreses of all server that has forwarded the incoming client
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            #It preserves the original public hostname
            proxy_set_header X-Forwarded-Host $http_host;

            #It tells that proxy is used (is a header marker)
            proxy_set_header X-NginX-Proxy true;

            #It tell WordPress whether the original request used HTTP or HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;

            # It tells that WordPress app root is to find under the given the subpath
            # Same is valid for compatible applications when they are exposed under
            # the /wordpress prefix. However, WordPress does not automatically use
            # this header, so WP_HOME and WP_SITEURL are still required.
            proxy_set_header X-Forwarded-Prefix /wordpress; 
            
            # Allows reuse of upstream keepalive connections.
            proxy_set_header Connection "";

            # Maximum time allowed to establish a connection to WordPress.
            proxy_connect_timeout 10s;

            # Maximum idle time between response reads from WordPress.
            proxy_read_timeout 60s;
            # Maximum idle time between write operations to WordPress.
            proxy_send_timeout 60s;
            
            # No automatical replacement of Location or Refresh headers is allowed
            proxy_redirect off;
        }

        # PrestaShop sits at the forefront and owns the root path.
        # This also allows its assets such as /themes/,/modules/, /img/, and /js/ to work naturally,
        # since they work properly when they are root-relative to PrestaShop app
        location / {
            proxy_pass http://prestashop_webservice/;
            
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_redirect off; 
        }
    }
}




 